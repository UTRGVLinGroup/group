<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="editor-token" content="__TOKEN__"><title>Wei Lin · Website editor</title><link rel="stylesheet" href="/editor.css"><script src="/editor.js" defer></script></head>
<body><header><div class="brand">W <span>Wei Lin <small>Website editor</small></span></div><span class="private">Private · This computer</span></header>
<div class="layout"><nav aria-label="Editor sections"><button data-view="home">Overview</button><button data-view="news">News</button><button data-view="courses">Courses</button><button data-view="publications">Publications</button><button data-view="queue">Publication review</button><button data-view="pages">Other pages</button><button data-view="backups">Backups &amp; settings</button><p>1. Edit and save<br>2. Preview your changes<br>3. Export and upload</p><a href="https://scholar.google.com/citations?user=3SFNLZ4AAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer">Open professor’s Scholar ↗</a></nav>
<main><div id="notice" role="status" aria-live="polite"></div><div id="screen"></div></main></div>
<dialog id="work-dialog"><form id="work-form"><h2 id="work-heading">Publication details</h2><p>Check the authors and source before approving. Scholar can include work by another person with the same name.</p><label>Title<textarea name="title" required></textarea></label><label>Authors<textarea name="authors" required></textarea></label><div class="two"><label>Year (optional)<input name="year" inputmode="numeric" pattern="[0-9]{4}" placeholder="2026"></label><label>Type<select name="kind"><option value="published">Publication / other research output</option><option value="manuscript">Unpublished manuscript</option><option value="preprint">Preprint (not peer reviewed)</option></select></label></div><label>Journal, conference, or repository<input name="journal"></label><label>Source link<input name="link" type="url" placeholder="https://..."></label><div class="actions"><button type="submit" id="work-submit">Save publication</button><button type="button" class="secondary" id="cancel-work">Cancel</button></div></form></dialog>
</body></html>
